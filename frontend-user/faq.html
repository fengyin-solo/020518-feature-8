<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客服中心 - 贵州红色旅游</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .chat-steps{display:flex;align-items:center;padding:10px 16px;background:#fafafa;border-bottom:1px solid #f0f0f0;flex-wrap:wrap;row-gap:6px}
        .chat-step{display:flex;align-items:center;gap:6px;font-size:12px;color:#999}
        .chat-step .step-dot{width:20px;height:20px;border-radius:50%;background:#e8e8e8;color:#999;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
        .chat-step.active{color:#C41A1A;font-weight:600}
        .chat-step.active .step-dot{background:#C41A1A;color:#fff}
        .chat-step.done{color:#52c41a}
        .chat-step.done .step-dot{background:#52c41a;color:#fff}
        .chat-step-arrow{color:#ddd;margin:0 8px;font-size:10px}
        .chat-sys{text-align:center;margin:4px 0 12px;font-size:12px;color:#999}
        .chat-sys span{background:#f0f0f0;border-radius:12px;padding:4px 14px;display:inline-block}
        .candidate-btns{display:flex;flex-direction:column;gap:8px;margin-top:10px}
        .candidate-btn{text-align:left;padding:8px 14px;border:1px solid #C41A1A;color:#C41A1A;background:#fff;border-radius:16px;cursor:pointer;font-size:13px;transition:all .2s}
        .candidate-btn:hover{background:#C41A1A;color:#fff}
        .transfer-btn{margin-top:10px;padding:8px 18px;border:none;background:#C41A1A;color:#fff;border-radius:16px;cursor:pointer;font-size:13px}
        .transfer-btn:hover{opacity:.9}
    </style>
</head>
<body>
<header class="header">
    <div class="container header-inner">
        <a href="index.html" class="logo"><i class="fas fa-flag"></i> <span>贵州红色旅游</span></a>
        <nav class="nav">
            <a href="index.html" data-i18n="home">首页</a>
            <a href="spots.html" data-i18n="spots">景点</a>
            <a href="routes.html" data-i18n="routes">线路</a>
            <a href="culture.html" data-i18n="culture">红色文化</a>
            <a href="hotels.html" data-i18n="hotels">酒店</a>
            <a href="foods.html" data-i18n="foods">美食</a>
            <a href="faq.html" class="active" data-i18n="faq">客服</a>
        </nav>
        <div class="header-right">
            <div class="lang-switcher"><select id="langSelect" onchange="switchLang(this.value)"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option></select></div>
            <div id="userMenu"></div>
        </div>
    </div>
</header>

<div class="container">
    <div class="chat-page-wrap">
    <div class="chat-container">
        <div class="chat-steps">
            <div class="chat-step" data-step="BOT"><span class="step-dot">1</span>智能客服问答</div>
            <i class="fas fa-chevron-right chat-step-arrow"></i>
            <div class="chat-step" data-step="CLARIFYING"><span class="step-dot">2</span>确认问题</div>
            <i class="fas fa-chevron-right chat-step-arrow"></i>
            <div class="chat-step" data-step="ANSWERED"><span class="step-dot">3</span>智能解答</div>
            <i class="fas fa-chevron-right chat-step-arrow"></i>
            <div class="chat-step" data-step="HUMAN"><span class="step-dot">4</span>人工客服</div>
            <span id="stageText" style="margin-left:auto;font-size:12px;color:#C41A1A"></span>
            <button id="modeToggle" class="btn btn-outline btn-sm" style="border-radius:20px" onclick="toggleMode()">
                <i class="fas fa-headset"></i> <span id="modeLabel">转人工客服</span>
            </button>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input">
            <input type="text" id="chatInput" placeholder="输入您的问题..." onkeyup="if(event.key==='Enter')sendMessage()">
            <button class="btn btn-primary" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div></div>
</div>

<footer class="footer"><div class="container"><p>© 2026 贵州红色文化旅游景点信息管理系统</p></div></footer>

<script src="js/common.js"></script>
<script>
const chatEl = document.getElementById('chatMessages');
let stage = 'BOT';          // 服务端链路阶段
let forceBot = false;       // 人工阶段下用户手动切回智能客服
let pollTimer = null;
let lastMsgKey = '';
let faqMap = {};            // 快捷提问 id -> question

const STAGE_ORDER = { BOT: 1, CLARIFYING: 2, ANSWERED: 3, TRANSFERRED: 4, HUMAN: 4 };
const STAGE_LABEL = {
    BOT: '智能客服问答中',
    CLARIFYING: '请在下方选择您要问的问题',
    ANSWERED: '智能客服已为您解答',
    TRANSFERRED: '已转人工，等待客服接入',
    HUMAN: '人工客服服务中'
};

function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function isHumanMode() {
    return !forceBot && (stage === 'TRANSFERRED' || stage === 'HUMAN');
}

/* ========== 链路进度指示 ========== */
function renderSteps() {
    const cur = STAGE_ORDER[stage] || 1;
    document.querySelectorAll('.chat-step').forEach(el => {
        const s = STAGE_ORDER[el.dataset.step] || 1;
        el.classList.toggle('done', s < cur);
        el.classList.toggle('active', s === cur);
    });
    document.getElementById('stageText').textContent = STAGE_LABEL[stage] || '';
}

function updateModeUI() {
    const human = isHumanMode();
    document.getElementById('modeLabel').textContent = human ? '返回智能客服' : '转人工客服';
    document.getElementById('modeToggle').style.background = human ? '#C41A1A' : '';
    document.getElementById('modeToggle').style.color = human ? '#fff' : '';
    document.getElementById('chatInput').placeholder = human ? '输入消息给人工客服...' : '输入您的问题...';
    renderSteps();
}

/* ========== 消息渲染 ========== */
function addUserMsg(text) {
    chatEl.insertAdjacentHTML('beforeend', '<div class="chat-msg user">' +
        '<div class="chat-icon"><i class="fas fa-user"></i></div>' +
        '<div class="chat-bubble">' + esc(text) + '</div></div>');
    chatEl.scrollTop = chatEl.scrollHeight;
}

function addBotMsg(html) {
    chatEl.insertAdjacentHTML('beforeend', '<div class="chat-msg bot">' +
        '<div class="chat-icon"><i class="fas fa-robot"></i></div>' +
        '<div class="chat-bubble">' + html + '</div></div>');
    chatEl.scrollTop = chatEl.scrollHeight;
}

function addAdminMsg(text) {
    chatEl.insertAdjacentHTML('beforeend', '<div class="chat-msg bot">' +
        '<div class="chat-icon" style="background:#52c41a;color:#fff"><i class="fas fa-headset"></i></div>' +
        '<div class="chat-bubble" style="background:#f6ffed;border:1px solid #b7eb8f">' + esc(text) + '</div></div>');
    chatEl.scrollTop = chatEl.scrollHeight;
}

function addSysMsg(text) {
    chatEl.insertAdjacentHTML('beforeend', '<div class="chat-sys"><span><i class="fas fa-headset"></i> ' + esc(text) + '</span></div>');
    chatEl.scrollTop = chatEl.scrollHeight;
}

function addCandidatesMsg(text, candidates) {
    let btns = '';
    (candidates || []).forEach(c => {
        btns += '<button class="candidate-btn" onclick="confirmFaq(' + c.id + ')">' + esc(c.question) + '</button>';
    });
    addBotMsg(esc(text || '为您找到以下相近问题，请选择您想了解的：') +
        '<div class="candidate-btns">' + btns + '</div>');
}

function addNoneMsg(text) {
    addBotMsg(esc(text) +
        '<div><button class="transfer-btn" onclick="transferToHuman()"><i class="fas fa-headset"></i> 转人工客服</button></div>');
}

/** 渲染一条历史消息（USER/BOT/ADMIN，含候选列表与转人工提示） */
function appendMessage(m) {
    if (m.sender === 'USER') { addUserMsg(m.content); return; }
    if (m.sender === 'ADMIN') { addAdminMsg(m.content); return; }
    if (m.msgType === 'TRANSFER') { addSysMsg(m.content); return; }
    if (m.msgType === 'CANDIDATES') {
        let payload = null;
        try { payload = JSON.parse(m.content); } catch (e) {}
        if (payload && payload.candidates) { addCandidatesMsg(payload.text, payload.candidates); return; }
        addBotMsg(esc(m.content));
        return;
    }
    if (m.msgType === 'NONE') { addNoneMsg(m.content); return; }
    addBotMsg(esc(m.content));
}

function renderAll(messages) {
    chatEl.innerHTML = '';
    if (!messages || !messages.length) { showWelcome(); return; }
    messages.forEach(appendMessage);
    chatEl.scrollTop = chatEl.scrollHeight;
}

/* ========== 历史消息（重新进入保持原有顺序） ========== */
async function refreshHistory(force) {
    if (!getUser()) return;
    const data = await api('/api/chat/history');
    if (!data) return;
    stage = data.stage || 'BOT';
    const msgs = data.messages || [];
    const key = msgs.length + ':' + (msgs.length ? msgs[msgs.length - 1].id : 0);
    if (force || key !== lastMsgKey) {
        lastMsgKey = key;
        renderAll(msgs);
    }
    updateModeUI();
}

function startPoll() {
    stopPoll();
    pollTimer = setInterval(() => refreshHistory(false), 5000);
}
function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

/* ========== 欢迎语与快捷提问 ========== */
async function showWelcome() {
    addBotMsg('您好！欢迎来到贵州红色旅游客服中心 🎉<br>我是智能客服小红，有什么可以帮您的？');
    const faqs = await api('/api/faq/list');
    if (faqs && faqs.length) {
        faqMap = {};
        faqs.forEach(f => faqMap[f.id] = f.question);
        let html = '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">';
        faqs.slice(0, 8).forEach(f => {
            html += '<button class="btn btn-outline btn-sm" style="border-radius:20px" onclick="askQuick(' + f.id + ')">' + esc(f.question) + '</button>';
        });
        html += '</div>';
        addBotMsg('您可以点击下方常见问题快速提问：' + html);
    }
}

function askQuick(faqId) {
    const q = faqMap[faqId];
    if (!q) return;
    addUserMsg(q);
    doAsk(q);
}

/* ========== 提问 → 追问/答复 ========== */
async function doAsk(question) {
    const typingId = 'typing_' + Date.now();
    chatEl.insertAdjacentHTML('beforeend', '<div class="chat-msg bot" id="' + typingId + '">' +
        '<div class="chat-icon"><i class="fas fa-robot"></i></div>' +
        '<div class="chat-bubble"><i class="fas fa-spinner fa-spin"></i> 正在思考...</div></div>');
    chatEl.scrollTop = chatEl.scrollHeight;

    const data = await api('/api/faq/ask?question=' + encodeURIComponent(question));
    const typingEl = document.getElementById(typingId);
    if (typingEl) typingEl.remove();

    if (!data) {
        addBotMsg('抱歉，我暂时无法回答这个问题，您可以换个方式提问或联系人工客服。');
        return;
    }
    if (data.stage) stage = data.stage;
    forceBot = false;
    if (getUser()) {
        // 登录用户的问答已由服务端落库，以历史记录为准渲染，保证顺序一致
        await refreshHistory(true);
    } else {
        renderAskResponse(data);
    }
    updateModeUI();
}

/** 未登录用户的本地渲染（不落库） */
function renderAskResponse(data) {
    if (data.type === 'CANDIDATES') {
        addCandidatesMsg('为您找到以下相近问题，请选择您想了解的：', data.candidates);
    } else if (data.type === 'NONE') {
        addNoneMsg(data.answer || '抱歉，暂时无法回答您的问题。');
    } else {
        addBotMsg(esc(data.answer));
        addSysMsg('如果还没有解决您的问题，可以点击上方「转人工客服」');
    }
}

/** 用户从候选中选定问题 → 给出完整答复 */
async function confirmFaq(faqId) {
    const data = await api('/api/faq/confirm?faqId=' + faqId);
    if (!data) return;
    if (data.stage) stage = data.stage;
    forceBot = false;
    if (getUser()) {
        await refreshHistory(true);
    } else {
        addUserMsg(data.question);
        addBotMsg(esc(data.answer));
        addSysMsg('如果还没有解决您的问题，可以点击上方「转人工客服」');
    }
    updateModeUI();
}

/* ========== 转人工 ========== */
async function transferToHuman() {
    if (!getUser()) { showToast('请先登录后才能使用人工客服', 'error'); return; }
    const data = await api('/api/chat/transfer');
    if (!data) return;
    stage = data.stage || 'TRANSFERRED';
    forceBot = false;
    const msgs = data.messages || [];
    lastMsgKey = msgs.length + ':' + (msgs.length ? msgs[msgs.length - 1].id : 0);
    renderAll(msgs);
    updateModeUI();
    startPoll();
}

function toggleMode() {
    if (isHumanMode()) {
        forceBot = true;
        updateModeUI();
        addSysMsg('已切回智能客服，输入问题将继续由智能客服解答');
    } else {
        transferToHuman();
    }
}

/* ========== 发送 ========== */
async function sendMessage() {
    const input = document.getElementById('chatInput');
    const q = input.value.trim();
    if (!q) return;
    input.value = '';
    if (isHumanMode()) {
        if (!getUser()) { showToast('请先登录', 'error'); return; }
        addUserMsg(q);
        await api('/api/chat/send?content=' + encodeURIComponent(q));
        await refreshHistory(true);
    } else {
        addUserMsg(q);
        await doAsk(q);
    }
}

/* ========== 初始化 ========== */
updateModeUI();
if (getUser()) {
    refreshHistory(true);
    startPoll();
} else {
    showWelcome();
}
</script>
</body>
</html>
